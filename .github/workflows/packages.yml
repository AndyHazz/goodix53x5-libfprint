name: Packages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - packaging/**
      - patches/**
      - scripts/build-local.sh
      - scripts/build-milan-stack-local.sh
      - scripts/lib/**
      - udev/**
      - meson-integration.patch
      - .github/workflows/packages.yml
      - '!**/*.md'
  workflow_call:
    inputs:
      version:
        description: Release version, such as 1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION:-0.0.0~dev.${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/make-source-archive.sh "$VERSION" dist

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: dist/*.tar.xz
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: docker.io/library/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ubuntu-22.04, image: "ubuntu:22.04" }
          - { target: ubuntu-24.04, image: "ubuntu:24.04" }
          - { target: ubuntu-26.04, image: "ubuntu:26.04" }
          - { target: debian-12, image: "debian:12" }
          - { target: debian-13, image: "debian:13" }
          - { target: fedora-43, image: "fedora:43" }
          - { target: fedora-44, image: "fedora:44" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
          path: dist

      - name: Build packages
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: packaging/build-package.sh --install-deps "dist/goodix53x5-libfprint-$VERSION.tar.xz" out

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  arch:
    name: arch
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: docker.io/library/archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
          path: dist

      - name: Build AUR package
        env:
          VERSION: ${{ needs.source.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pacman -Syu --noconfirm --needed git
          # makepkg refuses to run as root.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          archive="goodix53x5-libfprint-$VERSION.tar.xz"
          install -d -o builder aur out
          sudo -u builder packaging/arch/make-aur-package.sh "dist/$archive" "$REPOSITORY" aur
          # makepkg uses a source file already present instead of downloading it.
          cp -- "dist/$archive" aur/
          (cd aur && sudo -u builder makepkg --syncdeps --noconfirm)
          tar --owner=0 --group=0 --numeric-owner -czf "out/libfprint-goodix53x5-aur-$VERSION.tar.gz" \
            -C aur PKGBUILD .SRCINFO libfprint-goodix53x5.install

      - name: Upload AUR package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-arch
          path: out/*
          if-no-files-found: error
