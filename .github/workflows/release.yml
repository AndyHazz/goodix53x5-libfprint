name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: patch, minor, major, or an exact version such as 1.0.0
        required: true
        default: patch
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not $GITHUB_REF"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select version
        id: next
        env:
          RELEASE: ${{ inputs.release }}
        run: packaging/next-version.sh "$RELEASE" >> "$GITHUB_OUTPUT"

  packages:
    name: Packages
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Draft release
    needs: [version, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          # GitHub replaces "~" in asset names with "."; checksum the names users download.
          shopt -s nullglob
          for file in *~*; do
            mv -- "$file" "${file//\~/.}"
          done
          sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists"
            exit 1
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          : > "$notes_file"
          if [[ -n "$PREVIOUS" ]]; then
            gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$PREVIOUS" --jq '.body' > "$notes_file"
            printf '\n\n' >> "$notes_file"
          fi
          sed -e "s/@TAG@/$tag/g" -e "s/@VERSION@/$VERSION/g" -e "s|@REPOSITORY@|$GH_REPO|g" \
            packaging/release-notes.md >> "$notes_file"
          gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes_file"
